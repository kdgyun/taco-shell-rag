name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      RUN_GPU_TESTS: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.19"
          python-version: '${{ matrix.python }}'
          enable-cache: true
      - name: Check dependency lock
        run: uv lock --check
      - name: Install test dependencies
        run: uv sync --frozen --group dev --python '${{ matrix.python }}'
      - name: Contract tests
        run: uv run --frozen pytest -q
      - name: Lint
        run: uv run --frozen ruff check src tests scripts
      - name: Build and inspect distributions
        run: |
          uv build --out-dir dist
          python3 scripts/check_release.py dist
      - name: Validate Compose without private settings
        env:
          MCP_AUTH_TOKEN: compose-validation-only-not-a-real-token
          RAG_ENV_FILE: /dev/null
          GENERATOR_TOKEN: compose-validation-only-not-a-real-token
          GENERATOR_IMAGE: example.invalid/generator:validation
          GENERATOR_MODEL: validation/model
          GENERATOR_REVISION: "0000000000000000000000000000000000000000"
        run: |
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null -f compose.yaml -f compose.inference-split.yaml config --quiet
          docker compose --env-file /dev/null -f compose.yaml -f compose.generator.yaml config --quiet
          docker compose --env-file /dev/null -f compose.yaml -f compose.inference-split.yaml -f compose.generator.yaml config --quiet
