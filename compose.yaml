name: taco-shell-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - qdrant:/qdrant/storage
    networks: [backend]

  inference:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    restart: unless-stopped
    environment:
      MODEL_CONFIG: /config/models.toml
      INFERENCE_ROLE: ${INFERENCE_ROLE:-all}
      HF_TOKEN: ${HF_TOKEN:-}
      # 이전 환경변수를 조용히 무시하지 않고 런타임에서 이전 방법을 안내한다.
      # Keep legacy keys visible so the runtime rejects them with migration guidance.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-}
    volumes:
      - models:/models
      - ${MODEL_CONFIG_PATH:-./models.toml}:/config/models.toml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${EMBEDDING_GPU_ID:-${INFERENCE_GPU_ID:-0}}"]
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 15m
    networks: [backend]

  mcp:
    build: .
    restart: unless-stopped
    command: [--config, /config/taco.toml, serve]
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?run scripts/bootstrap.py first}
    env_file: ["${RAG_ENV_FILE:-.env}"]
    volumes:
      - ${RAG_CONFIG_PATH:-./taco.toml}:/config/taco.toml:ro
      - ${MODEL_CONFIG_PATH:-./models.toml}:/config/models.toml:ro
      - ./examples/knowledge:/config/examples/knowledge:ro
      - state:/config/data
    ports:
      - "127.0.0.1:${MCP_PORT:-8080}:8080"
    depends_on:
      inference:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks: [backend]

  indexer:
    build: .
    restart: unless-stopped
    profiles: [sync]
    env_file: ["${RAG_ENV_FILE:-.env}"]
    command: [--config, /config/taco.toml, sync, --watch]
    volumes:
      - ${RAG_CONFIG_PATH:-./taco.toml}:/config/taco.toml:ro
      - ./examples/knowledge:/config/examples/knowledge:ro
      - state:/config/data
    depends_on:
      inference:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks: [backend]

volumes:
  qdrant:
  models:
  state:

networks:
  backend:
